name: earanyak
description: "eআরণ্যক - Protected Wildlife Magazine & Nature Library"
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  file_picker: ^8.1.7
  pdfx: ^2.6.0
  photo_view: ^0.15.0
  cached_network_image: ^3.4.1
  audioplayers: ^6.7.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  http: ^1.2.0
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.10.9
  flutter_windowmanager_plus: ^1.1.0
  book_page_flip: ^0.1.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  package_info_plus: ^8.1.0
  permission_handler: ^11.3.1
  device_info_plus: ^11.1.0
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icon/
    - assets/audio/
    - assets/books/